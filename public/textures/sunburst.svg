<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" aria-hidden="true">
  <!-- Brand sunburst ray fan (design-spec §7). Amber.from -> brand radial fade. -->
  <defs>
    <radialGradient id="fahman-sunburst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="55%" stop-color="#F89B3C"/>
      <stop offset="100%" stop-color="#F5811F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g fill="url(#fahman-sunburst)">
